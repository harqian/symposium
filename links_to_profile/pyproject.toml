[project]
name = "links-to-profile"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "openai>=1.50",
  "tenacity>=9.0",
  "joblib>=1.4",
  "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/links_to_profile"]
